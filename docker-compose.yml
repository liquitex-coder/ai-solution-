version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wordpress}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html

  auditor:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      AINAVI_GATE_MEMORY_DB: /app/data/memory.db
      AINAVI_GATE_PORT: 8090
      AINAVI_GATE_BIND: 0.0.0.0
      AINAVI_GATE_TOKEN: ${AINAVI_GATE_TOKEN:-}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n
    depends_on:
      auditor:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - GENERIC_TIMEZONE=Asia/Tokyo
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin}
      - AINAVI_GATE_URL=http://auditor:8090
      - AINAVI_GATE_MODE=${AINAVI_GATE_MODE:-report_only}
      - AINAVI_GATE_TOKEN=${AINAVI_GATE_TOKEN:-}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  db_data:
  wp_data:
  n8n_data:
