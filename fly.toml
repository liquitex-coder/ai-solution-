# Fly.io configuration for Claim Auditor service
# Deploy: fly deploy -c fly.toml
# Secrets: fly secrets set CLAIM_AUDITOR_TOKEN=<value>

app = "claim-auditor"
primary_region = "nrt"  # Tokyo (adjust to operator's region)

[build]
dockerfile = "Dockerfile"

[env]
CLAIM_AUDITOR_BIND = "0.0.0.0"
CLAIM_AUDITOR_PORT = "8090"
CLAIM_MEMORY_DB = "/app/data/memory.db"
PYTHONUNBUFFERED = "1"

[http_service]
internal_port = 8090
force_https = true
auto_stop_machines = "off"
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/health"
timeout = "3s"

[[mounts]]
source = "data"
destination = "/app/data"
